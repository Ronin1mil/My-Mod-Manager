<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ronin Mod Manager</title>
<link rel="stylesheet" href="/style.css">
</head><body>
<div id="boot" role="status" aria-live="polite"><div class="boot-in">
 <div class="boot-mark" aria-hidden="true"><i></i><i></i><i></i></div>
 <div class="boot-name">Ronin Mod Manager</div>
 <div class="boot-bar"><i></i></div>
 <div class="boot-msg" id="bootmsg">Starting…</div></div></div>
<div id="block" role="alertdialog" aria-live="assertive" aria-modal="true" aria-labelledby="blocktitle" hidden><div class="block-card">
 <h2 id="blocktitle">Working…</h2><p id="blockmsg"></p>
 <div class="pbar" id="blockbar"><i></i></div><div class="mut" id="blocknum"></div>
 <p class="mut">Please wait, the window cannot be used until this finishes.</p></div></div>
<div id="app">
 <aside id="side">
  <div class="logo" id="logo"></div>
  <select id="game" aria-label="Game"></select>
  <div class="side-h">Playsets</div>
  <div id="psfixed"></div>
  <div id="pslist"></div>
  <div class="side-btns"><button id="new">+ New</button><button id="imp">Import</button><input type="file" id="impf" accept=".json" hidden></div>
  <div class="side-foot"><button id="appcfg" class="sm">⚙ Settings</button><span id="ver" class="mut"></span></div>
 </aside>
 <section id="center">
  <header id="top">
   <h1 id="title"></h1>
   <span class="grow"></span>
   <label class="chk" title="Keep dependencies loading first automatically (Sort now also orders mods that overwrite each other)"><input type="checkbox" id="auto"> Auto-sort</label>
   <button id="sortnow" title="Reorder so dependencies load first, then so mods that overwrite each other load in a sensible order (a report says why)">Sort now</button>
   <button id="installbtn">Install mod…</button><input type="file" id="installf" accept=".zip,.tar,.gz,.tgz,.bz2,.tbz2,.xz,.txz" hidden>
   <span class="menuwrap"><button id="toolsbtn" aria-haspopup="true" aria-expanded="false">Tools ▾</button>
    <div id="toolsmenu" class="menu" hidden>
     <button id="rescan" title="Read this game's mod folders again">Refresh<small>Read this game's mod folders again</small></button>
     <button id="fullscan" title="Every game: look for moved folders on every drive, read every mod again, find steamcmd and check every playset again (like starting the app)">Rescan<small>Every game, like starting the app</small></button>
     <button id="updbtn" title="Ask GitHub for the newest version of Ronin Mod Manager and install it">Check for updates<small>Install the newest version</small></button>
    </div></span>
   <button id="cfg">Playset settings</button>
  </header>
  <div id="banner" hidden></div>
  <nav id="tabs"></nav>
  <div id="view"></div>
  <div id="busy" aria-hidden="true"><div class="boot-in"><div id="busylogo"></div><div class="boot-bar"><i></i></div><div class="boot-msg" id="busymsg"></div></div></div>
  <footer id="play">
   <div id="status" class="mut"></div>
   <span class="grow"></span>
   <button id="launchpart" title="Start the game with only some of this playset's mods">Launch part…</button>
   <button id="launch" class="pri big">▶ Play</button>
  </footer>
 </section>
 <aside id="drawer"></aside>
</div>
<div id="drop">Drop a mod archive (.zip, .tar.gz, …) to install it</div>
<div id="toast" role="status"></div>
<dialog id="dlg" closedby="closerequest"></dialog>
<script src="/app.js"></script>
</body></html>
