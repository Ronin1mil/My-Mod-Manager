name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.py }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        py: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - run: python -m unittest discover -s tests -v

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node tests/e2e/ui.mjs
      - run: GAME=ck3 node tests/e2e/ui.mjs
      - run: node tests/e2e/order.mjs
      - run: node tests/e2e/compare.mjs
      - run: node tests/e2e/games.mjs
      - run: node tests/e2e/features.mjs
      - run: node tests/e2e/culture.mjs
      - run: node tests/e2e/switch.mjs
        env:
          BROWSER: "true"
        env:
          BROWSER: "true"  # a steam:// URL must never open anything on a CI machine

  build:
    name: Build app (${{ matrix.name }})
    needs: [unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: Mod-Manager-windows.exe, sep: ";"}
          - {os: ubuntu-22.04, name: Mod-Manager-linux, sep: ":"}
          - {os: macos-latest, name: Mod-Manager-macos, sep: ":"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - name: Build single-file app
        shell: bash
        run: pyinstaller --onefile --noconfirm --name "${{ matrix.name }}" --add-data "modmanager/static${{ matrix.sep }}modmanager/static" --add-data "modmanager/presets${{ matrix.sep }}modmanager/presets" modmanager/__main__.py
      - name: Smoke test the built app (starts, serves the page, lists the games)
        shell: bash
        run: |
          ./dist/${{ matrix.name }} --version
          ./dist/${{ matrix.name }} --no-browser --port 8799 &
          APP_PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/api/games && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/api/games | grep -q '"can_self_update": true'
          curl -sf http://127.0.0.1:8799/ | grep -q "Mod Manager"
          kill $APP_PID || true
        env:
          MODMANAGER_CONFIG_DIR: ${{ runner.temp }}/cfg
          MODMANAGER_LOG_DIR: ${{ runner.temp }}/log
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    name: Publish GitHub release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, e2e, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the app's version
        run: test "v$(python3 -c 'import modmanager; print(modmanager.__version__)')" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums (the in-app updater refuses a download that does not match these)
        working-directory: dist
        run: sha256sum Mod-Manager-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release (the in-app update check reads this)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
