name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.py }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        py: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - run: python -m unittest discover -s tests -v

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node tests/e2e/ui.mjs
      - run: GAME=ck3 node tests/e2e/ui.mjs
      - run: node tests/e2e/order.mjs
      - run: node tests/e2e/compare.mjs
      - run: node tests/e2e/games.mjs
      - run: node tests/e2e/features.mjs
        env:
          BROWSER: "true"  # a steam:// URL must never open anything on a CI machine

  windows-exe:
    name: Windows single-file exe (unverified build)
    needs: [unit]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name Mod-Manager --add-data "modmanager/static;modmanager/static" --add-data "modmanager/presets;modmanager/presets" modmanager/__main__.py
      - run: (Get-FileHash dist/Mod-Manager.exe -Algorithm SHA256).Hash | Out-File dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mod-Manager-windows
          path: dist/

  release:
    name: Publish GitHub release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, e2e, windows-exe]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Mod-Manager-windows
          path: dist
      - name: Create release (the in-app update check reads this)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
