name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release for the version in modmanager/__init__.py (creates its tag)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.py }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        py: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - run: python -m unittest discover -s tests -v

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-24.04
    env:
      BROWSER: "true"  # a steam:// URL must never open anything on a CI machine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node tests/e2e/ui.mjs
      - run: GAME=ck3 node tests/e2e/ui.mjs
      - run: node tests/e2e/order.mjs
      - run: node tests/e2e/compare.mjs
      - run: node tests/e2e/games.mjs
      - run: node tests/e2e/features.mjs
      - run: node tests/e2e/culture.mjs
      - run: node tests/e2e/switch.mjs

  build:
    name: Build app (${{ matrix.name }})
    needs: [unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows and macOS get a native window (pywebview); Linux opens a Chrome/Edge app window or the browser
          - {os: windows-latest, name: Mod-Manager-windows.exe, sep: ";", webview: true, flags: "--windowed --icon installer/icon.ico --collect-all webview"}
          - {os: ubuntu-22.04, name: Mod-Manager-linux, sep: ":", webview: false, flags: ""}
          - {os: macos-latest, name: Mod-Manager-macos, sep: ":", webview: true, flags: "--collect-all webview"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - name: Install the native window library
        if: matrix.webview
        run: pip install pywebview
      - name: Build single-file app
        shell: bash
        run: pyinstaller --onefile --noconfirm ${{ matrix.flags }} --name "${{ matrix.name }}" --add-data "modmanager/static${{ matrix.sep }}modmanager/static" --add-data "modmanager/presets${{ matrix.sep }}modmanager/presets" modmanager/__main__.py
      - name: Smoke test the built app (starts, serves the page, lists the games)
        shell: bash
        run: |
          ./dist/${{ matrix.name }} --version
          ./dist/${{ matrix.name }} --no-browser --port 8799 &
          APP_PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/api/games && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/api/games | grep -q '"can_self_update": true'
          curl -sf http://127.0.0.1:8799/ | grep -q "Mod Manager"
          kill $APP_PID || true
        env:
          MODMANAGER_CONFIG_DIR: ${{ runner.temp }}/cfg
          MODMANAGER_LOG_DIR: ${{ runner.temp }}/log
      - name: The native window library made it into the app
        if: matrix.webview
        shell: bash
        run: |
          rm -f probe.json
          ./dist/${{ matrix.name }} --probe-window probe.json &
          for i in $(seq 1 40); do [ -s probe.json ] && break; sleep 1; done
          cat probe.json; echo
          grep -q '"pywebview": true' probe.json
          grep -q '"native": true' probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  installer:
    name: Windows installer
    needs: [build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Mod-Manager-windows.exe
          path: dist
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        shell: pwsh
        run: |
          $v = python -c "import modmanager; print(modmanager.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\ModManager.iss
          Get-ChildItem dist
      - name: Install it silently, start the installed app, uninstall
        shell: pwsh
        env:
          MODMANAGER_CONFIG_DIR: ${{ runner.temp }}\cfg
          MODMANAGER_LOG_DIR: ${{ runner.temp }}\log
        run: |
          $dir = "$env:RUNNER_TEMP\mm-installed"
          Start-Process dist\Mod-Manager-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\Mod-Manager.exe")) { throw "installer did not install the app" }
          & "$dir\Mod-Manager.exe" --version
          $p = Start-Process "$dir\Mod-Manager.exe" -ArgumentList "--no-browser","--port","8798" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { $r = Invoke-RestMethod http://127.0.0.1:8798/api/games; if ($r.can_self_update) { $ok = $true; break } } catch { }
            Start-Sleep 1
          }
          Stop-Process $p -Force
          if (-not $ok) { throw "installed app did not start or cannot self-update" }
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT" -Wait
      - uses: actions/upload-artifact@v4
        with:
          name: Mod-Manager-Setup.exe
          path: dist/Mod-Manager-Setup.exe

  release:
    name: Publish GitHub release (tags, or a manual run with "publish")
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [unit, e2e, build, installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out the tag (a pushed tag must match the app's version)
        run: |
          V="v$(python3 -c 'import modmanager; print(modmanager.__version__)')"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then test "$V" = "$GITHUB_REF_NAME"; fi
          echo "TAG=$V" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums (the in-app updater refuses a download that does not match these)
        working-directory: dist
        run: sha256sum Mod-Manager-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release (the in-app update check reads this)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
